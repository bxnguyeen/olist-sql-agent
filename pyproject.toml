[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
olist-ask = "olist_agent.cli:main"
olist-eval = "olist_agent.evaluate:main"
olist-report = "olist_agent.evaluate:report"

[tool.setuptools.packages.find]
where = ["src"]
